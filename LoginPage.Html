<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>
<body>

<div class="LoginPage">

    <h2>Login</h2>

    <form>
        <input type="text" id="name" class="user_data" placeholder="name" required>

        <input type="password" id="password" class="user_data" placeholder="Password" required>

        <input type="text" id="email" class="user_data" placeholder="Email" required>

        <input type="number" id="number" class="user_data" placeholder="Number" required>

        <button type="button" class="btn" onclick="login()">Login</button>
    </form>

</div>

<script src="LoginPage.js"></script>

</body>
</html>
